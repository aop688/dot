# Nerd Fonts v3.2.0
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b1,U+e700-U+e7c5,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f372,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

symbol_map U+4E00-U+9FFF,U+3000-U+303F,U+3040-U+30FF,U+AC00-U+D7AF LXGW WenKai

font_size        14.0

#remember_window_position yes
remember_window_size  no
initial_window_width  120c
initial_window_height 40c

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6

cursor_shape underline
#tab_title_template "{index}"
#tab_bar_edge     top
#tab_bar_style    custom
#tab_powerline_style slanted
window_padding_width 8 8
hide_window_decorations titlebar-only

shell_integration disabled
macos_option_as_alt yes
#clear_all_shortcuts yes
allow_remote_control yes

shell /opt/homebrew/bin/bash --login -i

# BEGIN_KITTY_FONTS
font_family      family="Iosevka Berkeley Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

background            #1E1E1E
foreground            #D8DADC
selection_background  #264F78
selection_foreground  none
cursor                #ECF0F1
cursor_text_color     background
url_color             #4AA3DF
url_style             curly
# black
color0   #3A3A3A
color8   #767676
# red
color1   #E5534B
color9   #FF7B72
# green
color2   #00CC00
color10  #33FF33
# yellow
color3   #F1C40F
color11  #FFD95A
# blue
color4   #4AA3DF
color12  #79C0FF
# magenta
color5   #B07CD8
color13  #D2A8FF
# cyan
color6   #1ABC9C
color14  #48E0C0
# white
color7   #BDC3C7
color15  #F5F7F8

tab_bar_background       #181818
active_tab_background    #34495E
active_tab_foreground    #ECF0F1
active_tab_font_style    bold
inactive_tab_background  #252525
inactive_tab_foreground  #8A8F94
inactive_tab_font_style  normal

active_border_color      #00CC00
inactive_border_color    #2E2E2E
bell_border_color        #F1C40F

mark1_background  #4AA3DF
mark1_foreground  #1E1E1E
mark2_background  #F1C40F
mark2_foreground  #1E1E1E
mark3_background  #B07CD8
mark3_foreground  #1E1E1E

macos_titlebar_color background
