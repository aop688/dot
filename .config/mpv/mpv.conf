# mpv 配置 —— Apple M4 / 16GB / 60Hz Retina
# 目标：硬解低功耗 + 合理画质 + 顺手的日常体验

##### 视频输出与解码 #####
vo=gpu-next                  # 新渲染器（libplacebo），效率和画质都优于 gpu
gpu-api=vulkan
gpu-context=macvk            # Vulkan over Metal
hwdec=videotoolbox           # M4 媒体引擎硬解 H.264/HEVC/AV1，零拷贝，省电
hwdec-codecs=all

# 缩放：开销低、画质足够；不启用 ewa_* 这类高耗能滤镜
scale=spline36
cscale=spline36
dscale=mitchell
correct-downscaling=yes
deband=no                    # 去色带很吃 GPU，片源差时按 b 临时开

# 视频同步：跟随音频，最省资源（display-resample 更平滑但更耗电）
video-sync=audio

##### 缓存（16GB 内存，给得宽裕但不浪费）#####
cache=yes
demuxer-max-bytes=256MiB     # 向前缓存
demuxer-max-back-bytes=64MiB # 向后缓存，回退几秒不必重新读取
demuxer-readahead-secs=20

##### 窗口 #####
autofit-larger=80%x80%       # 大视频不超过屏幕 80%
keep-open=yes                # 播完停在最后一帧，不直接退出
native-fs=yes                # 使用 macOS 原生全屏
cursor-autohide=1000

##### 播放记忆 #####
save-position-on-quit=yes    # 退出时记住进度，下次续播
watch-later-options-remove=volume,mute,sub-visibility

##### 音频 #####
volume=100
volume-max=150
audio-file-auto=fuzzy
alang=chi,zho,zh,chs,cht,jpn,eng

##### 字幕 #####
sub-auto=fuzzy               # 自动加载同名/相近文件名的外挂字幕
slang=chs,sc,zh-hans,zh-cn,chi,zho,zh,cht,tc,eng,en
sub-codepage=auto
sub-font-size=44
sub-border-size=2.5
sub-shadow-offset=1
sub-ass-override=no          # 保留 ASS 字幕原样式

##### 字体（修复 PingFangUI 无法打开的报错）#####
osd-font="Hiragino Sans GB"
sub-font="Hiragino Sans GB"

##### OSD #####
osd-font-size=32
osd-duration=1500
osd-bar-h=2

##### 截图 #####
screenshot-format=png
screenshot-png-compression=5
screenshot-dir=~/Desktop
screenshot-template="mpv-%F-%P"

##### 网络流（需 yt-dlp）#####
ytdl-format=bestvideo[height<=?1440]+bestaudio/best

##### 播放控制界面 #####
# 禁用内置 OSC，改用 scripts/osc.lua（基于 0.41.0 源码，加了边框颜色选项）
osc=no

##### 条件配置 #####
# 高分辨率 / 高帧率片源：用最轻的缩放，保证流畅
[high-res]
profile-cond=(width or 0) > 2560 or (container_fps or 0) > 60
profile-restore=copy
scale=bilinear
dscale=bilinear
cscale=bilinear
