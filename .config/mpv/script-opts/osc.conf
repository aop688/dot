# 内置 OSC 精简样式：底部居中小浮框，鼠标移开后自动隐藏
# 注意：本文件不支持行尾注释，注释须单独成行

# 底部居中小浮框：只有进度条和时间
layout=slimbox
# knob 样式使浮框变为圆角胶囊形；把手大小设 0 则不显示把手
seekbarstyle=knob
seekbarhandlesize=0
# slider：已播放部分画成圆角填充条（需配合 knob 样式）
seekrangestyle=slider
# 拖动时对齐关键帧，跳转更快
seekbarkeyframes=yes

# 鼠标移到窗口底部附近才显示，停止 0.8 秒后隐藏
deadzonesize=0.8
hidetimeout=800
fadeduration=150
boxalpha=30

# 界面放大 1.5 倍；大小固定，不随视频分辨率变化
scalewindowed=1.5
scalefullscreen=1.5
vidscale=no

# 右侧显示总时长
timetotal=yes
timems=no
title=${media-title}
# 使用 macOS 原生标题栏按钮
windowcontrols=no

# 配色：timecode_color 同时控制进度条和时间文字
background_color=#000000
timecode_color=#E8A33D
title_color=#FFFFFF
buttons_color=#FFFFFF
small_buttonsL_color=#DDDDDD
small_buttonsR_color=#DDDDDD
time_pos_color=#FFFFFF
held_element_color=#999999
# 浮框边框颜色（需 scripts/osc.lua 补丁版才生效）
box_border_color=#E8A33D

# 浮框位置：贴到最底部，尽量避开字幕（-1 最顶，1 最底，默认 0.8）
valign=1.0
